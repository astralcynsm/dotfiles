# Arch → Fedora 44 包映射（桌面核心 + 工具链范围）
#
# 生成依据（2026-10-08 实测，非回忆）：
#   - Fedora 44 官方仓库：releases/44/Everything/x86_64 + updates/44/Everything/x86_64
#     的 repodata primary 元数据（共 91607 个包名），逐一比对
#   - RPM Fusion free/nonfree 44（release + updates），共 740 个包名
#   - COPR 各仓库 fedora-44-x86_64 的 repodata primary，取实际包名与版本
#   - /home/cynsm/ricing/dots-hyprland/sdata/dist-fedora/feddeps.toml（ii 上游 Fedora 依赖表）
#     本表复用它作为基础层，只记录差异与增补
#
# 字段：
#   arch     Arch 侧包名（Qqe/Qqm 原样）
#   fedora   Fedora 侧要装的包名（数组；空数组 = 无对应包）
#   source   official | rpmfusion | copr:<owner>/<project> | cargo | pipx | source | flatpak | ""
#   pin      版本约束（空串 = 无约束）
#   status   verified  = 已核实（包名/版本在本机实测的元数据里出现过）
#            assumed   = 未核实（查不到官方包，替代路径也没实测）
#            blocked   = 有明确障碍
#            drop      = 不迁
#            replace   = 换工具/换包名（含改名）
#            flatpak   = 走 Flatpak
#   notes    取舍理由
#   category 供 package-map.md 分组用
#
# 注意：status = "replace" 既用于「同名不同包」（如 lib32-*）也用于「改了包名」（如 noto-fonts-cjk → google-noto-sans-cjk-fonts）。
#       fedora 数组里若有多个包，逐个都是要装的。

