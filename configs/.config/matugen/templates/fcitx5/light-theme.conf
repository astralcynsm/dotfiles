# 由 matugen 生成，请勿手改
# 模板源: ~/.config/matugen/templates/fcitx5/light-theme.conf
#
# 浅色版 fcitx5 主题，由 classicui.conf 的 Theme= 指向。
# 换壁纸时 matugen 重新生成；明暗切换由 fcitx5 自己按系统 color-scheme 选。
# 圆角靠同目录的 panel.png / highlight.png 实现（fcitx5 的 9-patch 背景）。
# ⚠ 别改回 SVG：fcitx5 的 SVG 分支缺 CAIRO_EXTEND_PAD，会在边缘透出背景
# （表现为候选框上一圈红/蓝细线）。PNG 由 switch.sh 的 sync_fcitx5_assets()
# 从 _colors.env 里的颜色画出来，原因详见 _colors.env 顶部注释。

[Metadata]
Name=Matugen-Light
Version=1.0
Author=matugen (auto-generated)
Description=跟随壁纸配色的浅色主题
ScaleWithDPI=True

[InputPanel]
# 普通候选字
NormalColor={{colors.on_surface.light.hex}}
# 选中的候选字
HighlightCandidateColor={{colors.on_primary_container.light.hex}}
# 已输入的字符（拼音串）
# ⚠ 用 secondary 而不是 primary：理由同 dark 版 —— primary 是 Material You
# 刻意做高饱和的强调色，而拼音串一直挂在候选框上，用它会刺眼。
# 明暗两套必须保持一致的处理，否则切换时会突然变刺眼。
HighlightColor={{colors.secondary.light.hex}}
# 已输入字符的背景
HighlightBackgroundColor={{colors.primary_container.light.hex}}
FullWidthHighlight=True
Spacing=3

[InputPanel/Background]
Image=panel.png
Color={{colors.surface_container.light.hex}}
BorderColor=#00000000
BorderWidth=0

[InputPanel/Background/Margin]
Left=18
Right=18
Top=18
Bottom=18

[InputPanel/Highlight]
Image=highlight.png
Color={{colors.primary_container.light.hex}}
BorderColor=#00000000
BorderWidth=0

[InputPanel/Highlight/Margin]
Left=14
Right=14
Top=14
Bottom=14

[InputPanel/ContentMargin]
Left=8
Right=8
Top=6
Bottom=6

[InputPanel/TextMargin]
Left=10
Right=10
Top=7
Bottom=7

[Menu]
NormalColor={{colors.on_surface.light.hex}}
HighlightCandidateColor={{colors.on_primary_container.light.hex}}
Spacing=0

[Menu/Background]
Image=panel.png
Color={{colors.surface_container.light.hex}}
BorderColor=#00000000
BorderWidth=0

[Menu/Background/Margin]
Left=18
Right=18
Top=18
Bottom=18

[Menu/Highlight]
Image=highlight.png
Color={{colors.primary_container.light.hex}}
BorderColor=#00000000
BorderWidth=0

[Menu/Highlight/Margin]
Left=14
Right=14
Top=14
Bottom=14

[Menu/ContentMargin]
Left=10
Right=10
Top=10
Bottom=10

[Menu/TextMargin]
Left=6
Right=6
Top=6
Bottom=6
