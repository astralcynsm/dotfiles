# 由 matugen 生成，请勿手改
# 模板源: ~/.config/matugen/templates/fcitx5/dark-theme.conf
#
# 深色版 fcitx5 主题，由 classicui.conf 的 DarkTheme= 指向。
# 换壁纸时 matugen 重新生成；明暗切换由 fcitx5 自己按系统 color-scheme 选。
# 圆角靠同目录的 panel.png / highlight.png 实现（fcitx5 的 9-patch 背景）。
# ⚠ 别改回 SVG：fcitx5 的 SVG 分支缺 CAIRO_EXTEND_PAD，会在边缘透出背景
# （表现为候选框上一圈红/蓝细线）。PNG 由 switch.sh 的 sync_fcitx5_assets()
# 从 _colors.env 里的颜色画出来，原因详见 _colors.env 顶部注释。

[Metadata]
Name=Matugen-Dark
Version=1.0
Author=matugen (auto-generated)
Description=跟随壁纸配色的深色主题
ScaleWithDPI=True

[InputPanel]
# 普通候选字
NormalColor={{colors.on_surface.dark.hex}}
# 选中的候选字
HighlightCandidateColor={{colors.on_primary_container.dark.hex}}
# 已输入的字符（拼音串）
# ⚠ 用 secondary 而不是 primary：primary 在深色模式下是 Material You 刻意
# 做亮的高饱和色（本机当前壁纸算出来是 #f5bc6f 亮橙金），而拼音串是一直
# 挂在候选框上的元素，用它会在深棕底上非常刺眼（用户实测反馈「neon」）。
# secondary 同样是壁纸派生色，但是柔和的暖米（#dec2a2），不抢眼。
HighlightColor={{colors.secondary.dark.hex}}
# 已输入字符的背景
HighlightBackgroundColor={{colors.primary_container.dark.hex}}
FullWidthHighlight=True
Spacing=3

[InputPanel/Background]
Image=panel.png
Color={{colors.surface_container.dark.hex}}
BorderColor=#00000000
BorderWidth=0

[InputPanel/Background/Margin]
Left=18
Right=18
Top=18
Bottom=18

[InputPanel/Highlight]
Image=highlight.png
Color={{colors.primary_container.dark.hex}}
BorderColor=#00000000
BorderWidth=0

[InputPanel/Highlight/Margin]
Left=14
Right=14
Top=14
Bottom=14

[InputPanel/ContentMargin]
Left=8
Right=8
Top=6
Bottom=6

[InputPanel/TextMargin]
Left=10
Right=10
Top=7
Bottom=7

[Menu]
NormalColor={{colors.on_surface.dark.hex}}
HighlightCandidateColor={{colors.on_primary_container.dark.hex}}
Spacing=0

[Menu/Background]
Image=panel.png
Color={{colors.surface_container.dark.hex}}
BorderColor=#00000000
BorderWidth=0

[Menu/Background/Margin]
Left=18
Right=18
Top=18
Bottom=18

[Menu/Highlight]
Image=highlight.png
Color={{colors.primary_container.dark.hex}}
BorderColor=#00000000
BorderWidth=0

[Menu/Highlight/Margin]
Left=14
Right=14
Top=14
Bottom=14

[Menu/ContentMargin]
Left=10
Right=10
Top=10
Bottom=10

[Menu/TextMargin]
Left=6
Right=6
Top=6
Bottom=6
