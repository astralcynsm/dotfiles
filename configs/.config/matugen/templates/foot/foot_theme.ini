### 由 matugen 生成，请勿手改
### 模板源: ~/.config/matugen/templates/foot/foot_theme.ini
###
### 本文件不会自动生效。启用/停用方式：
###   启用 matugen 配色: cp ~/.config/foot/themes/matugen.ini ~/.config/foot/current_theme.ini
###   换回 Gruvbox:      cp ~/.config/foot/themes/dark.ini    ~/.config/foot/current_theme.ini
###
### 下面同时生成 dark / light 两段，但 **foot 不会自己挑**：
###   foot 不读 XDG Portal（foot 1.28.0 实测：二进制里连 "portal" 这个字符串
###   都没有，也没链任何 portal 客户端库；foot.ini(5)/foot(1) 里也 0 次提及），
###   它按 initial-color-theme 选段，而这一项的**默认值是 dark** ——
###   也就是说，不写下面这一行，新开的窗口永远用 [colors-dark]，
###   切到浅色模式它也不会跟着变。
### 所以必须由模板把当前明暗写进去：{{mode}} 就是 matugen --mode 的值
### （实测 matugen 3.1.0 认这个变量：--mode dark 出 "dark"，light 出 "light"）。
###
### ⚠ initial-color-theme 必须留在任何 [section] 之前（即 [main] 段）。
###   放错段 foot 会直接拒绝解析，报错原文：
###     [colors-dark].initial-color-theme: light: not valid option
###   好在是响亮失败、不会静默生效。所以这一行别往下挪。

initial-color-theme={{mode}}

[colors-dark]
alpha=0.95
foreground={{colors.on_surface.dark.hex_stripped}}
background={{colors.surface.dark.hex_stripped}}

## Normal/Regular colors
regular0={{colors.surface_container_highest.dark.hex_stripped}}  # black
regular1={{colors.error.dark.hex_stripped}}  # red
regular2={{colors.primary_fixed_dim.dark.hex_stripped}}  # green
regular3={{colors.tertiary_fixed_dim.dark.hex_stripped}}  # yellow
regular4={{colors.primary.dark.hex_stripped}}  # blue
regular5={{colors.secondary.dark.hex_stripped}}  # magenta
regular6={{colors.tertiary.dark.hex_stripped}}  # cyan
regular7={{colors.on_surface_variant.dark.hex_stripped}}  # white

## Bright colors
bright0={{colors.outline.dark.hex_stripped}}  # bright black
bright1={{colors.error.dark.hex_stripped}}  # bright red
bright2={{colors.primary_fixed.dark.hex_stripped}}  # bright green
bright3={{colors.tertiary_fixed.dark.hex_stripped}}  # bright yellow
bright4={{colors.primary_fixed.dark.hex_stripped}}  # bright blue
bright5={{colors.secondary_fixed.dark.hex_stripped}}  # bright magenta
bright6={{colors.tertiary_fixed.dark.hex_stripped}}  # bright cyan
bright7={{colors.on_surface.dark.hex_stripped}}  # bright white

## 选区
selection-foreground={{colors.on_primary_container.dark.hex_stripped}}
selection-background={{colors.primary_container.dark.hex_stripped}}

[colors-light]
alpha=0.95
foreground={{colors.on_surface.light.hex_stripped}}
background={{colors.surface.light.hex_stripped}}

## Normal/Regular colors
regular0={{colors.surface_container_highest.light.hex_stripped}}  # black
regular1={{colors.error.light.hex_stripped}}  # red
regular2={{colors.primary_fixed_dim.light.hex_stripped}}  # green
regular3={{colors.tertiary_fixed_dim.light.hex_stripped}}  # yellow
regular4={{colors.primary.light.hex_stripped}}  # blue
regular5={{colors.secondary.light.hex_stripped}}  # magenta
regular6={{colors.tertiary.light.hex_stripped}}  # cyan
regular7={{colors.on_surface_variant.light.hex_stripped}}  # white

## Bright colors
bright0={{colors.outline.light.hex_stripped}}  # bright black
bright1={{colors.error.light.hex_stripped}}  # bright red
bright2={{colors.primary_fixed.light.hex_stripped}}  # bright green
bright3={{colors.tertiary_fixed.light.hex_stripped}}  # bright yellow
bright4={{colors.primary_fixed.light.hex_stripped}}  # bright blue
bright5={{colors.secondary_fixed.light.hex_stripped}}  # bright magenta
bright6={{colors.tertiary_fixed.light.hex_stripped}}  # bright cyan
bright7={{colors.on_surface.light.hex_stripped}}  # bright white

## 选区
selection-foreground={{colors.on_primary_container.light.hex_stripped}}
selection-background={{colors.primary_container.light.hex_stripped}}
