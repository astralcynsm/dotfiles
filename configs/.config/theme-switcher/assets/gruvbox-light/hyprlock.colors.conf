# Gruvbox Light —— 由 theme-switcher 管理
# ⚠ 改这个文件不生效（下次切主题会被覆盖）
#    要改请改 ~/.config/theme-switcher/assets/gruvbox-light/hyprlock.colors.conf

$text_color = rgba(3c3836FF)
$entry_background_color = rgba(3c383611)
$entry_border_color = rgba(7c6f6455)
$entry_color = rgba(b57614FF)
$font_family = Google Sans Flex Medium
$font_family_clock = Google Sans Flex Medium
$font_material_symbols = Material Symbols Rounded

# 三档前景色（对应 JaKooLit 版 hyprlock.conf 里的 $color11/12/13）
$color13 = rgba(3c3836FF)   # fg1    —— 正文 / 时钟
$color12 = rgba(b57614FF)   # yellow —— 分钟数字（浅底用深黄）
$color11 = rgba(7c6f64FF)   # fg4    —— 秒数 / 输入框外圈

# 锁屏背景由 hyprlock.conf 里的 .wallpaper_current 决定，
# 这里不放 $background_image（切主题会覆盖壁纸，不是我们想要的）
