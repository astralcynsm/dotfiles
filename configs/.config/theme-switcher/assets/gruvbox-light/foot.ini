# Gruvbox Light —— 由 theme-switcher 管理
# ⚠ 改这个文件不生效（下次切主题会被覆盖）
#    要改请改 ~/.config/theme-switcher/assets/gruvbox-light/foot.ini
#
# 用 [colors-dark] 段头是刻意的：静态主题的调色板整段写在这一段里，
# 与已验证可用的 gruvbox-dark 保持一致（foot 的 dark/light 之分对
# "固定配色"没有意义）。
#
# 但下面这行是必须的：foot 的 initial-color-theme **默认值恰好是 dark**，
# 不写它也能用 —— 那是巧合，不是保证。显式钉死，行为才不依赖 foot 的内部默认。

initial-color-theme=dark

[colors-dark]
alpha=0.95
foreground=3c3836
background=fbf1c7

## Normal/Regular colors
regular0=fbf1c7  # black
regular1=9d0006  # red
regular2=79740e  # green
regular3=b57614  # yellow
regular4=076678  # blue
regular5=8f3f71  # magenta
regular6=427b58  # cyan
regular7=7c6f64  # white

## Bright colors
bright0=928374   # bright black
bright1=cc241d   # bright red
bright2=98971a   # bright green
bright3=d79921   # bright yellow
bright4=458588   # bright blue
bright5=b16286   # bright magenta
bright6=689d6a   # bright cyan
bright7=3c3836   # bright white
