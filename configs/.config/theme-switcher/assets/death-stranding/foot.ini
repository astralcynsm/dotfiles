# Death Stranding —— 由 theme-switcher 管理
# ⚠ 改这个文件不生效（下次切主题会被覆盖）
#    要改请改 ~/.config/theme-switcher/assets/death-stranding/foot.ini
#
# 静态主题的调色板整段写在 [colors-dark] 里，所以把色彩段钉死在 dark。
# 不写也能用，只因 foot 的 initial-color-theme 默认值恰好是 dark ——
# 显式写上，才不依赖那个巧合。

initial-color-theme=dark

[colors-dark]
alpha=0.95
foreground=e6e6e6
background=0a0a0a

## Normal/Regular colors
regular0=0a0a0a  # black
regular1=c1443a  # red
regular2=5a9c6a  # green
regular3=e8842c  # yellow —— 用琥珀橙，DS 的主色
regular4=4a7ba7  # blue
regular5=9a6fa8  # magenta
regular6=4ac6b7  # cyan —— DS 的对比强调色
regular7=c8c8c8  # white

## Bright colors
bright0=3a3a3a   # bright black
bright1=e85a4a   # bright red
bright2=7ab88a   # bright green
bright3=ffa855   # bright yellow
bright4=6a9bc7   # bright blue
bright5=b88fc8   # bright magenta
bright6=6ee0cf   # bright cyan
bright7=e6e6e6   # bright white
