# Death Stranding —— 由 theme-switcher 管理
# ⚠ 改这个文件不生效（下次切主题会被覆盖）
#    要改请改 ~/.config/theme-switcher/assets/death-stranding/hyprlock.colors.conf

$text_color = rgba(e6e6e6FF)
$entry_background_color = rgba(14141411)
$entry_border_color = rgba(33333355)
$entry_color = rgba(e8842cFF)
$font_family = Google Sans Flex Medium
$font_family_clock = Google Sans Flex Medium
$font_material_symbols = Material Symbols Rounded

# 三档前景色（对应 JaKooLit 版 hyprlock.conf 里的 $color11/12/13）
$color13 = rgba(e6e6e6FF)   # 正文 / 时钟
$color12 = rgba(e8842cFF)   # 琥珀橙 —— 分钟数字
$color11 = rgba(6a6a6aFF)   # 中性灰 —— 秒数 / 输入框外圈

# 锁屏背景由 hyprlock.conf 里的 .wallpaper_current 决定，
# 这里不放 $background_image（切主题会覆盖壁纸，不是我们想要的）
