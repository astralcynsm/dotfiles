# Kanagawa Dark —— 由 theme-switcher 管理
# ⚠ 改这个文件不生效（下次切主题会被覆盖）
#    要改请改 ~/.config/theme-switcher/assets/kanagawa-dark/hyprlock.colors.conf

$text_color = rgba(ddd8bbFF)
$entry_background_color = rgba(2a2a3711)
$entry_border_color = rgba(72716955)
$entry_color = rgba(e5c283FF)
$font_family = Google Sans Flex Medium
$font_family_clock = Google Sans Flex Medium
$font_material_symbols = Material Symbols Rounded

# 三档前景色（对应 JaKooLit 版 hyprlock.conf 里的 $color11/12/13）
$color13 = rgba(ddd8bbFF)   # fujiWhite —— 正文 / 时钟
$color12 = rgba(e5c283FF)   # carpYellow —— 分钟数字
$color11 = rgba(727169FF)   # comment    —— 秒数 / 输入框外圈

# 锁屏背景由 hyprlock.conf 里的 .wallpaper_current 决定，
# 这里不放 $background_image（切主题会覆盖壁纸，不是我们想要的）
