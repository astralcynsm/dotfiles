# Kanagawa Dark —— 由 theme-switcher 管理
# ⚠ 改这个文件不生效（下次切主题会被覆盖）
#    要改请改 ~/.config/theme-switcher/assets/kanagawa-dark/foot.ini
#
# 原始素材来自 ~/.config/foot/themes/kanagawa-backup/dark.ini
#
# 静态主题的调色板整段写在 [colors-dark] 里，所以把色彩段钉死在 dark。
# 不写也能用，只因 foot 的 initial-color-theme 默认值恰好是 dark ——
# 显式写上，才不依赖那个巧合。

initial-color-theme=dark

[colors-dark]
alpha=0.95
background=1f1f28
foreground=ddd8bb

# 选中文本颜色
selection-foreground=ddd8bb
selection-background=49473e

# 光标颜色
cursor=1f1f28 e6e0c2

## Normal colors
regular0=1f1f28  # black
regular1=e46a78  # red
regular2=98bc6d  # green
regular3=e5c283  # yellow
regular4=7eb3c9  # blue
regular5=957fb8  # magenta
regular6=7eb3c9  # cyan
regular7=ddd8bb  # white

## Bright colors
bright0=8e8ead   # bright black
bright1=ec818c   # bright red
bright2=9ec967   # bright green
bright3=f1c982   # bright yellow
bright4=7bc2df   # bright blue
bright5=a98fd2   # bright magenta
bright6=7bc2df   # bright cyan
bright7=a8a48d   # bright white
